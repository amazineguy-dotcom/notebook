<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨手筆記本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="筆記本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6EBEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141B22" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<script>
try { var t = localStorage.getItem("notebook.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<style>
/* Layout: one-screen app. A note rail beside a ruled-paper page; on phones the two swap places. */
:root {
  --bg: #E6EBEA;
  --paper: #FBFCFA;
  --ink: #1C2B3A;
  --muted: #627282;
  --rule: #D3DEE4;
  --margin: #E0707F;
  --accent: #2B5FA8;
  --accent-ink: #FFFFFF;
  --line: #C9D3D6;
  --sel: #DCE7F3;
  --danger: #B93848;
  --display: "LXGW WenKai TC", "Kaiti TC", "BiauKai", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --row: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141B22; --paper: #1C252E; --ink: #E3EAF0; --muted: #8C9BA9;
    --rule: #2C3944; --margin: #A8525F; --accent: #7FB0EE; --accent-ink: #0F1B28;
    --line: #2E3B46; --sel: #253547; --danger: #F08A97; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141B22; --paper: #1C252E; --ink: #E3EAF0; --muted: #8C9BA9;
  --rule: #2C3944; --margin: #A8525F; --accent: #7FB0EE; --accent-ink: #0F1B28;
  --line: #2E3B46; --sel: #253547; --danger: #F08A97; color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; }
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 8px 12px; min-height: 40px; }
button:hover { background: var(--sel); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); gap: 16px; padding-inline: 16px; padding-block: 16px; max-width: 1100px; margin-inline: auto; }

.rail { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.rail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 24px; margin: 0; letter-spacing: .04em; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; white-space: nowrap; }
.primary:hover { background: var(--accent); filter: brightness(1.08); }
#search { width: 100%; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }

.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
.list li { border-bottom: 1px solid var(--line); }
.item { display: block; width: 100%; text-align: left; border: 0; border-radius: 0; padding: 12px 8px; min-height: 0; }
.item[aria-current="true"] { background: var(--sel); }
.item-top { display: flex; align-items: baseline; gap: 8px; }
.item-title { font-family: var(--display); font-size: 18px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.item-badge { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.item-preview { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { color: var(--muted); margin: 0; padding: 20px 8px; line-height: 1.7; }
.store-note { color: var(--muted); font-size: 12px; margin: 0; }

.page { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.blank { margin: auto; padding: 24px; text-align: center; color: var(--muted); font-family: var(--display); font-size: 20px; }
.editor { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.bar .status { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .status.err { color: var(--danger); }
#back, #d-back { display: none; }
#pin[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
#del, .danger-text { color: var(--danger); }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--sel); }
.confirm span { flex: 1; min-width: 12em; }
.danger-btn { background: var(--danger); border-color: var(--danger); color: var(--paper); }

#note-title { border: 0; border-bottom: 2px solid var(--rule); background: transparent; font-family: var(--display); font-weight: 700; font-size: 24px; padding: 14px 16px 10px 44px; width: 100%; outline-offset: -2px;
  background-image: linear-gradient(90deg, transparent 31px, var(--margin) 31px, var(--margin) 32px, transparent 32px); }
#note-body, .ruled { flex: 1; min-height: 0; width: 100%; border: 0; resize: none; font-size: 17px; line-height: var(--row); padding: 0 16px 0 44px; outline-offset: -2px; background-color: transparent;
  background-image:
    linear-gradient(90deg, transparent 31px, var(--margin) 31px, var(--margin) 32px, transparent 32px),
    linear-gradient(transparent calc(var(--row) - 1px), var(--rule) calc(var(--row) - 1px));
  background-size: 100% 100%, 100% var(--row);
  background-attachment: local, local; }
#note-title:focus-visible, #note-body:focus-visible, .ruled:focus-visible { outline: none; }
::placeholder { color: var(--muted); opacity: .7; }

@media (max-width: 759px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .page { display: none; }
  .app.editing .notes-page, .app.diary-editing .diary-page { display: flex; }
  .app.editing .notes-rail, .app.diary-editing .diary-rail { display: none; }
  #back, #d-back { display: inline-block; }
}

html, body { margin: 0; height: 100%; overscroll-behavior: none; }
[hidden] { display: none !important; }
body { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
.app { height: 100dvh; padding-top: max(16px, env(safe-area-inset-top)); padding-bottom: max(16px, env(safe-area-inset-bottom)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
.foot { display: flex; flex-direction: column; gap: 8px; }
.foot-btns { display: flex; gap: 8px; }
.foot-btns button { flex: 1; font-size: 13px; }

.head-btns { display: flex; gap: 8px; }
.tag-bar { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; padding-bottom: 2px; }
.tag-bar::-webkit-scrollbar { display: none; }
.chip { min-height: 32px; padding: 4px 12px; border-radius: 16px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.item-tags { font-size: 12px; color: var(--accent); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#note-tags { border: 0; border-bottom: 1px solid var(--rule); background: transparent; font-size: 16px; color: var(--accent); padding: 6px 16px 6px 44px; width: 100%; outline-offset: -2px;
  background-image: linear-gradient(90deg, transparent 31px, var(--margin) 31px, var(--margin) 32px, transparent 32px); }
#note-tags:focus-visible { outline: none; }
#lock[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

.overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 15, 20, .45); }
#modal { z-index: 30; }
.sheet { width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 20px; background: var(--paper); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; }
.sheet h2 { font-family: var(--display); font-size: 21px; margin: 0; }
.sheet h3 { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
.sheet section { display: flex; flex-direction: column; }
.sheet-msg + .sheet-msg { margin-top: 6px; }
.sheet-msg { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
.sheet-err { margin: 0; color: var(--danger); font-size: 14px; min-height: 1.4em; }
.sheet-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sheet-btns { display: flex; justify-content: flex-end; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.field + .field { margin-top: 10px; }
.field input { font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.seg { display: flex; }
.seg button { flex: 1; border-radius: 0; }
.seg button + button { margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { position: relative; background: var(--sel); border-color: var(--accent); color: var(--accent); font-weight: 500; }

.app[data-view="diary"] .notes-only, .app:not([data-view="diary"]) .diary-only { display: none !important; }
.view-switch { flex-shrink: 0; }
#d-search { width: 100%; font-size: 16px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.cal { flex-shrink: 0; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.cal-head span { font-family: var(--display); font-size: 19px; font-weight: 700; }
.cal-head button { min-width: 44px; font-size: 18px; padding: 4px 10px; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-week span { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 2px; }
.day { position: relative; aspect-ratio: 1 / 1; min-height: 0; padding: 3px 5px; border: 1px solid transparent; border-radius: 6px; display: flex; align-items: flex-start; justify-content: flex-start; font-size: 13px; font-variant-numeric: tabular-nums; background-color: var(--paper); background-size: cover; background-position: center; overflow: hidden; }
.day.pad { visibility: hidden; }
.day.today { border-color: var(--accent); }
.day.today .day-num { color: var(--accent); font-weight: 700; }
.day[aria-current="date"] { outline: 2px solid var(--accent); outline-offset: 1px; }
.day.has-text::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--accent); }
.day.has-photo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,0) 60%); }
.day.has-photo .day-num, .day.has-photo.today .day-num { position: relative; color: #fff; font-weight: 700; }
.day.has-photo::after { background: #fff; }
.day.match { box-shadow: inset 0 0 0 2px var(--margin); }
.list-title { margin: 0; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.bar button { white-space: nowrap; flex-shrink: 0; }
.d-date { flex-shrink: 1; font-family: var(--display); font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.photos { display: flex; gap: 8px; overflow-x: auto; padding: 10px 12px; border-bottom: 1px solid var(--rule); flex-shrink: 0; }
.photo, .photo-add { flex: 0 0 auto; width: 72px; height: 72px; min-height: 0; padding: 0; border-radius: 6px; }
.photo { border: 1px solid var(--line); background-color: var(--sel); background-size: cover; background-position: center; }
.photo.missing { background-image: none; }
.photo-add { border-style: dashed; color: var(--accent); font-size: 13px; }
.viewer { flex-direction: column; gap: 12px; background: rgba(0, 0, 0, .88); }
.viewer img { max-width: 100%; max-height: calc(100% - 64px); object-fit: contain; border-radius: 4px; }
.viewer-bar { display: flex; gap: 8px; }
.viewer-bar button { color: #fff; border-color: rgba(255,255,255,.5); }
.viewer-bar .primary { color: var(--accent-ink); border-color: var(--accent); }
#viewer-del[data-armed] { background: #B93848; border-color: #B93848; }
</style>
</head>
<body>
<div class="app" id="app" data-view="notes">
  <aside class="rail notes-rail notes-only">
    <header class="rail-head">
      <h1>隨手筆記本</h1>
      <div class="head-btns">
        <button class="open-settings" type="button">設定</button>
        <button id="new-note" class="primary" type="button">＋ 新筆記</button>
      </div>
    </header>
    <div class="seg view-switch" aria-label="切換筆記或日記">
      <button type="button" data-view-opt="notes">筆記</button>
      <button type="button" data-view-opt="diary">日記</button>
    </div>
    <input id="search" type="search" placeholder="搜尋筆記或標籤" aria-label="搜尋筆記">
    <div id="tag-bar" class="tag-bar" aria-label="依標籤篩選" hidden></div>
    <ul id="note-list" class="list" aria-label="筆記列表"></ul>
    <div class="foot">
      <div class="foot-btns">
        <button class="js-export" type="button">匯出備份</button>
        <button class="js-import" type="button">匯入備份</button>
        <button id="relock" type="button" hidden>鎖上</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p class="store-note js-store-note">筆記只存在這支手機裡，建議定期匯出備份。</p>
    </div>
  </aside>

  <main class="page notes-page notes-only">
    <div id="blank" class="blank">選一則筆記，或寫一則新的。</div>
    <div id="editor" class="editor" hidden>
      <div class="bar">
        <button id="back" type="button" aria-label="回到列表">‹ 列表</button>
        <span id="status" class="status" role="status"></span>
        <button id="pin" type="button" aria-pressed="false">釘選</button>
        <button id="lock" type="button" aria-pressed="false">上鎖</button>
        <button id="del" type="button">刪除</button>
      </div>
      <div id="confirm" class="confirm" hidden>
        <span>刪除這則筆記？刪除後無法復原。</span>
        <button id="del-yes" class="danger-btn" type="button">刪除</button>
        <button id="del-no" type="button">取消</button>
      </div>
      <input id="note-title" type="text" placeholder="標題" aria-label="標題" autocomplete="off">
      <input id="note-tags" type="text" placeholder="標籤，用空白分開，例如：工作 待辦" aria-label="標籤" autocomplete="off" autocapitalize="off" enterkeyhint="next">
      <textarea id="note-body" placeholder="開始寫…" aria-label="內容"></textarea>
    </div>
  </main>

  <aside class="rail diary-rail diary-only">
    <header class="rail-head">
      <h1>隨手筆記本</h1>
      <div class="head-btns">
        <button class="open-settings" type="button">設定</button>
        <button id="d-today" class="primary" type="button">今天</button>
      </div>
    </header>
    <div class="seg view-switch" aria-label="切換筆記或日記">
      <button type="button" data-view-opt="notes">筆記</button>
      <button type="button" data-view-opt="diary">日記</button>
    </div>
    <input id="d-search" type="search" placeholder="搜尋日記" aria-label="搜尋日記">
    <div class="cal">
      <div class="cal-head">
        <button id="d-prev" type="button" aria-label="上個月">‹</button>
        <span id="d-month"></span>
        <button id="d-next" type="button" aria-label="下個月">›</button>
      </div>
      <div class="cal-week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div id="d-grid" class="cal-grid"></div>
    </div>
    <p id="d-list-title" class="list-title"></p>
    <ul id="d-list" class="list" aria-label="日記列表"></ul>
  </aside>

  <main class="page diary-page diary-only">
    <div id="d-blank" class="blank">在日曆上選一天，開始寫日記。</div>
    <div id="d-editor" class="editor" hidden>
      <div class="bar">
        <button id="d-back" type="button" aria-label="回到日曆">‹ 日曆</button>
        <span id="d-date" class="d-date"></span>
        <span id="d-status" class="status" role="status"></span>
        <button id="d-del" type="button" class="danger-text">刪除</button>
      </div>
      <div id="d-confirm" class="confirm" hidden>
        <span>刪除這天的日記和照片？刪除後無法復原。</span>
        <button id="d-del-yes" class="danger-btn" type="button">刪除</button>
        <button id="d-del-no" type="button">取消</button>
      </div>
      <div id="d-photos" class="photos">
        <button id="d-add-photo" class="photo-add" type="button">＋ 照片</button>
      </div>
      <input id="d-photo-file" type="file" accept="image/*" multiple hidden>
      <textarea id="d-body" class="ruled" placeholder="今天發生了什麼事？" aria-label="日記內容"></textarea>
    </div>
  </main>
</div>

<div id="viewer" class="overlay viewer" hidden>
  <img id="viewer-img" alt="日記照片">
  <div class="viewer-bar">
    <button id="viewer-del" type="button">刪除這張</button>
    <button id="viewer-close" class="primary" type="button">關閉</button>
  </div>
</div>

<div id="settings" class="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <h2 id="settings-title">設定</h2>
    <section>
      <h3>外觀</h3>
      <div class="seg">
        <button type="button" data-theme-opt="auto">跟隨系統</button>
        <button type="button" data-theme-opt="light">淺色</button>
        <button type="button" data-theme-opt="dark">深色</button>
      </div>
    </section>
    <section>
      <h3>上鎖密碼</h3>
      <p id="lock-state" class="sheet-msg"></p>
      <p class="sheet-msg">上鎖的筆記標題和內容會加密，標籤不會加密。</p>
      <div class="sheet-row">
        <button id="lock-set" type="button">設定密碼</button>
        <button id="lock-change" type="button">更改密碼</button>
        <button id="lock-now" type="button">立即鎖上</button>
      </div>
    </section>
    <section>
      <h3>備份</h3>
      <p class="sheet-msg">筆記和日記（含照片）都只存在這支手機裡。備份檔包含全部內容，照片多時檔案會比較大。</p>
      <div class="sheet-row">
        <button class="js-export" type="button">匯出備份</button>
        <button class="js-import" type="button">匯入備份</button>
      </div>
      <p class="sheet-msg js-store-note"></p>
    </section>
    <div class="sheet-btns"><button id="settings-close" class="primary" type="button">完成</button></div>
  </div>
</div>

<div id="modal" class="overlay" hidden>
  <form id="modal-form" class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title" novalidate>
    <h2 id="modal-title"></h2>
    <p id="modal-msg" class="sheet-msg"></p>
    <div id="modal-fields"></div>
    <p id="modal-err" class="sheet-err" role="alert"></p>
    <div class="sheet-btns">
      <button id="modal-cancel" type="button">取消</button>
      <button id="modal-ok" class="primary" type="submit">確定</button>
    </div>
  </form>
</div>

<script src="app.js"></script>
<script src="diary.js"></script>
</body>
</html>
